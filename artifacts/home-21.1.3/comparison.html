<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>HOME reference comparison</title>
<style>
  *{box-sizing:border-box}body{margin:0;padding:28px;background:#e9e3d8;font-family:Arial,sans-serif;color:#102d2b}.comparison{display:grid;grid-template-columns:360px 360px;justify-content:center;gap:28px}.panel{display:grid;gap:10px;align-content:start}.panel h1{margin:0;font-size:14px;letter-spacing:.12em}.frame{width:360px;height:800px;overflow:hidden;background:#f4efe3;box-shadow:0 12px 30px rgba(30,40,36,.15)}.frame img{display:block;width:100%;height:100%;object-fit:cover}.reference img{object-fit:contain;object-position:center top;background:#fffdf7}
</style>
<main class="comparison">
  <section class="panel"><h1>REFERENCE · 메인.png</h1><div class="frame reference"><img src="reference-main.png" alt="HOME 기준 시안"></div></section>
  <section class="panel"><h1>ACTUAL · 360×800</h1><div class="frame"><img src="home-360x800.png" alt="HOME 구현 캡처"></div></section>
</main>
